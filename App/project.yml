# XcodeGen projesi — `xcodegen generate` ile .xcodeproj üretir.
#
# Xcode projesi depoya konmuyor: üretilebilir bir dosyanın birleştirme
# çatışmalarını taşımanın anlamı yok. Kaynaklar SwiftPM hedeflerinden geliyor,
# yani `swift test` ile Xcode aynı kodu derliyor.
name: Bloomsort
options:
  bundleIdPrefix: com.mokka
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

packages:
  Bloomsort:
    path: ..
  # Reklam ve analitik SDK'ları. Sürümleri Xcode 26 / iOS 26 SDK ile
  # doğrulandıktan sonra sabitlenmeli (checklist Faz 4.2, Faz 7).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  Bloomsort:
    type: application
    platform: iOS
    sources:
      - path: BloomsortMain.swift
      - path: Resources
    resources:
      - path: ../Resources/levels.json
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mokka.bloomsort
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"   # yalnızca iPhone
    dependencies:
      - package: Bloomsort
        product: BloomsortApp
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleMobileAds
        product: UserMessagingPlatform
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
